[project]
name = "qwen-surgery"
version = "0.1.0"
description = "Edit the weights, layers and activations of a small open LLM and measure the effect"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mlx-lm>=0.32.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
